# 电商客服标准问答库
# 每条包含 question（用于检索）、answer（回答素材）、tags（提高召回）
faqs:
  - question: 退款多久能到账
    tags: [退款, 到账, 时效, 多久]
    answer: >-
      退款审核通过后，款项会原路退回。微信、支付宝一般 1-3 个工作日到账；
      银行卡支付因银行清算，通常 3-7 个工作日。若超过 7 个工作日仍未到账，
      请提供订单号和支付流水号，我们会协助向支付渠道核查。

  - question: 退款申请怎么取消
    tags: [退款, 取消, 撤销]
    answer: >-
      退款申请提交后，在商家审核通过前可以在订单详情页点击"撤销申请"。
      若商家已审核通过或商品已寄回，需要联系人工客服处理。

  - question: 支持七天无理由退货吗
    tags: [退货, 七天, 无理由, 退换]
    answer: >-
      支持。签收之日起 7 天内，商品保持完好、不影响二次销售即可申请无理由退货。
      定制类、鲜活易腐、拆封的数字化商品、贴身衣物等不适用七天无理由。

  - question: 退货运费谁承担
    tags: [退货运费, 运费, 谁出, 承担]
    answer: >-
      商品质量问题、发错货、少发漏发导致的退货，运费由商家承担；
      七天无理由退货，往返运费由买家承担。若订单带有"退货包运费"标识，
      在保障范围内可按页面说明抵扣。

  - question: 多久发货
    tags: [发货, 时效, 多久, 几天]
    answer: >-
      现货商品一般在付款后 48 小时内发出，预售商品以商品页标注的发货时间为准。
      大促期间订单量较大，发货可能顺延 1-2 天。发货后物流单号会同步到订单详情。

  - question: 可以指定快递公司吗
    tags: [快递, 指定, 物流公司]
    answer: >-
      默认由仓库根据收货地址自动匹配快递。如需指定，可以在下单备注中说明，
      我们会尽量协调，但无法保证一定满足。偏远地区可能仅支持邮政或特定快递。

  - question: 配送范围包括哪些地区
    tags: [配送, 范围, 地区, 偏远]
    answer: >-
      全国大部分地区均可配送。新疆、西藏、内蒙古部分地区以及港澳台属于偏远地区，
      可能产生额外运费或时效延长。具体以下单时页面提示为准。

  - question: 运费怎么计算
    tags: [运费, 计算, 包邮, 满减]
    answer: >-
      单笔订单实付满 99 元包邮（偏远地区除外）；未满 99 元收取 8 元基础运费。
      大件商品按重量和体积单独计费，下单页会明确展示运费金额。

  - question: 可以开发票吗
    tags: [发票, 开票, 增值税, 报销]
    answer: >-
      支持开具电子普通发票和增值税专用发票。订单完成后在"订单详情-申请开票"提交，
      电子普票一般 1 个工作日内开出并发送到预留邮箱；专票需提供完整开票资料，
      审核通过后 3-5 个工作日寄出。

  - question: 价保规则是什么
    tags: [价保, 降价, 补差价, 保价]
    answer: >-
      自签收之日起 15 天内，同一商品在同一店铺出现降价，可申请价保补差。
      需提供降价截图，且商品需处于可售状态。使用优惠券、限时秒杀、
      百亿补贴等特殊活动的价格不参与价保。

  - question: 优惠券为什么用不了
    tags: [优惠券, 用不了, 使用条件, 门槛]
    answer: >-
      常见原因有：未达到使用门槛、商品不在适用范围内、与当前活动互斥、
      优惠券已过期。可以在"我的-优惠券"查看每张券的适用范围和有效期。

  - question: 支持哪些支付方式
    tags: [支付, 付款, 微信, 支付宝, 银行卡]
    answer: >-
      支持微信支付、支付宝、银行卡快捷支付。部分商品支持分期付款，
      具体期数和手续费以下单页展示为准。

  - question: 商品有质量问题怎么办
    tags: [质量问题, 破损, 坏了, 瑕疵, 售后]
    answer: >-
      请在签收后 48 小时内拍照或录像留存证据，并在订单详情提交易损/质量问题售后。
      核实后可选择换货、维修或退款，往返运费由商家承担。

  - question: 怎么联系人工客服
    tags: [人工, 客服, 转人工, 联系]
    answer: >-
      你可以直接说"转人工"，我会为你转接人工客服。人工客服在线时间为每天 9:00-22:00，
      非工作时间可以留言，我们会在次日工作时间回复。

  - question: 订单可以修改收货地址吗
    tags: [改地址, 收货地址, 修改订单]
    answer: >-
      订单未发货前可以联系客服修改收货地址；已发货的订单无法在系统内修改，
      可以联系快递申请改派，是否成功取决于快递网点和包裹状态。

  - question: 会员有什么权益
    tags: [会员, PLUS, 权益, 积分]
    answer: >-
      PLUS 会员可享受专属折扣、每月运费券、优先客服通道和积分加速。
      普通会员可通过签到、评价、下单累积积分，积分可在积分商城兑换优惠券。
